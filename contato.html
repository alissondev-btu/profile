<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato - Alisson Leal</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        .form-card {
            border-radius: 16px;
        }

        .form-control,
        .form-select {
            border-radius: 10px;
        }

        .btn-send {
            padding: 10px 30px;
            border-radius: 10px;
        }
    </style>
</head>

<body class="bg-light d-flex flex-column min-vh-100">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">

        <div class="container">

            <a class="navbar-brand fw-bold" href="index.html">
                Alisson Leal
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#menuPrincipal">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse" id="menuPrincipal">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="index.html">
                            Home
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="perfil.html">
                            Perfil
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="portfolio.html">
                            Portfólio
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="contato.html">
                            Contato
                        </a>
                    </li>

                </ul>

            </div>

        </div>

    </nav>

    <main class="container my-5 flex-grow-1">

        <div class="row justify-content-center">

            <div class="col-lg-8">

                <div class="text-center mb-4">

                    <h1 class="fw-bold">
                        Entre em Contato
                    </h1>

                    <p class="text-muted">
                        Caso tenha interesse em conhecer mais sobre meus projetos,
                        trocar experiências ou entrar em contato para oportunidades
                        acadêmicas e profissionais, utilize o formulário abaixo.
                    </p>

                </div>

                <div class="card shadow-sm form-card">

                    <div class="card-body p-4 p-md-5">

                        <form action="mailto:seuemail@email.com" method="post" enctype="text/plain">

                            <div class="row g-3">

                                <div class="col-md-6">

                                    <label class="form-label">
                                        Nome
                                    </label>

                                    <input type="text"
                                        class="form-control"
                                        name="nome"
                                        required>

                                </div>

                                <div class="col-md-6">

                                    <label class="form-label">
                                        E-mail
                                    </label>

                                    <input type="email"
                                        class="form-control"
                                        name="email"
                                        required>

                                </div>

                                <div class="col-md-6">

                                    <label class="form-label">
                                        WhatsApp
                                    </label>

                                    <input type="text"
                                        class="form-control"
                                        name="whatsapp">

                                </div>

                                <div class="col-md-6">

                                    <label class="form-label">
                                        Área de Interesse
                                    </label>

                                    <select class="form-select" name="area">

                                        <option selected>
                                            Selecione...
                                        </option>

                                        <option>
                                            Desenvolvimento Web
                                        </option>

                                        <option>
                                            Ciência de Dados
                                        </option>

                                        <option>
                                            Análise de Dados
                                        </option>

                                        <option>
                                            Parcerias e Networking
                                        </option>

                                        <option>
                                            Outros
                                        </option>

                                    </select>

                                </div>

                                <div class="col-12">

                                    <label class="form-label">
                                        Assunto
                                    </label>

                                    <input type="text"
                                        class="form-control"
                                        name="assunto"
                                        required>

                                </div>

                                <div class="col-12">

                                    <label class="form-label">
                                        Mensagem
                                    </label>

                                    <textarea class="form-control"
                                        rows="5"
                                        name="mensagem"
                                        placeholder="Digite sua mensagem..."
                                        required></textarea>

                                </div>

                                <div class="col-12 text-center mt-3">

                                    <button type="submit"
                                        class="btn btn-primary btn-send">

                                        Enviar Mensagem

                                    </button>

                                </div>

                            </div>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </main>

    <footer class="bg-dark text-white py-4">

        <div class="container text-center">

            <div class="mb-3">

                <a href="https://github.com/alissondev-btu"
                target="_blank"
                class="text-white text-decoration-none me-4 fs-2">

                <i class="bi bi-github"></i>

            </a>

            <a href="https://wa.me/5514996167245"
                target="_blank"
                class="text-white text-decoration-none fs-2">

                <i class="bi bi-whatsapp"></i>

            </a>

            </div>

            <p class="mb-0">
                © 2026 - Alisson Leal de Oliveira
            </p>

        </div>

    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
